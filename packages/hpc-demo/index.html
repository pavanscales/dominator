<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPC Demo — Dominator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #111;
        }
        #app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        .perf-overlay {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1000;
            min-width: 280px;
            backdrop-filter: blur(10px);
        }
        .perf-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #006600;
            text-transform: uppercase;
        }
        .perf-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #666;
        }
        .perf-mono {
            font-family: 'JetBrains Mono', monospace;
            color: #00cc00;
            font-weight: 600;
        }
        .perf-mono.bad { color: #cc0000; }
        .perf-mono.warn { color: #cc9900; }
        .mode-overlay {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 12px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .mode-overlay h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #006600;
        }
        .mode-overlay p {
            color: #666;
            margin-bottom: 4px;
        }
        .mode-overlay .highlight { color: #00cc00; font-weight: 600; }
        .mode-overlay kbd {
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="perf-overlay">
        <div class="perf-title">HPC DEMO</div>
        <div class="perf-row"><span>FPS</span><span id="po-fps" class="perf-mono">--</span></div>
        <div class="perf-row"><span>ENTITIES</span><span id="po-entities" class="perf-mono">--</span></div>
        <div class="perf-row"><span>MODE</span><span id="po-mode" class="perf-mono">ORBIT</span></div>
        <div class="perf-row"><span>Δt</span><span id="po-dt" class="perf-mono">--ms</span></div>
    </div>
    <div class="mode-overlay">
        <h2>DOMINATOR HPC</h2>
        <p><span class="highlight">5,000</span> reactive entities</p>
        <p>ECS SoA • Frame Arenas • 10-Stage Pipeline</p>
        <p><kbd>Click</kbd> to cycle modes • <kbd>Mouse</kbd> to interact</p>
        <div style="margin-top: 8px; font-size: 11px; color: #888;">
            Modes: ORBIT → WAVE → SPIRAL → CHAOS
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
