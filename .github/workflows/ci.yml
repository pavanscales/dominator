name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: corepack enable && pnpm --version
      - run: pnpm install
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: corepack enable && pnpm --version
      - run: pnpm install
      - run: pnpm run test:ci

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: corepack enable && pnpm --version
      - run: pnpm install
      - run: pnpm --filter @dominator/core run build
