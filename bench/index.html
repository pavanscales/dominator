<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dominator DOD Benchmark</title>
<style>
  body { font-family: monospace; background: #0a0a0a; color: #00ff00; margin: 20px; }
  h1 { color: #ff4444; }
  .result { margin: 4px 0; font-size: 14px; }
  .metric { color: #ffff00; font-weight: bold; }
  #status { color: #00ffff; font-size: 18px; margin: 10px 0; }
  #results { white-space: pre; line-height: 1.6; }
  .section { color: #ff8800; font-size: 16px; margin-top: 12px; font-weight: bold; border-top: 1px solid #333; padding-top: 8px; }
</style>
</head>
<body>
<h1>Dominator DOD Benchmark Suite</h1>
<div id="status">Initializing...</div>
<div id="results"></div>
<div id="benchmark-data" style="display:none"></div>

<script>
(function() {
  const _values = [];
  const _subs = [];
  const _manualSubs = [];
  const _effectFns = [];
  const _effectDeps = [];
  let _activeEffect = -1;
  let _batchDepth = 0;
  let _dirtySignals = [];
  let _dirtyBitmap = new Uint8Array(8192);

  function signal(initialValue) {
    const id = _values.length;
    _values.push(initialValue);
    _subs.push([]);
    _manualSubs.push([]);
    const s = function() {
      if (_activeEffect >= 0) { _subs[id].push(_activeEffect); _effectDeps[_activeEffect].push(id); }
      return _values[id];
    };
    s.get = function() { return _values[id]; };
    s.set = function(v) {
      if (_values[id] !== v) {
        _values[id] = v;
        if (_batchDepth > 0) {
          if (id < 8192 && !_dirtyBitmap[id]) { _dirtyBitmap[id] = 1; _dirtySignals.push(id); }
          else if (id >= 8192) { _dirtySignals.push(id); }
        } else { _flushSignal(id); }
      }
    };
    s.update = function(fn) { s.set(fn(_values[id])); };
    return s;
  }

  function _flushSignal(id) {
    const subs = _subs[id]; const len = subs.length;
    for (let i = 0; i < len; i++) _runEffect(subs[i]);
  }

  function _runEffect(id) {
    const oldDeps = _effectDeps[id];
    for (let i = 0; i < oldDeps.length; i++) {
      const signalSubs = _subs[oldDeps[i]]; const idx = signalSubs.indexOf(id);
      if (idx >= 0) { signalSubs[idx] = signalSubs[signalSubs.length - 1]; signalSubs.length--; }
    }
    _effectDeps[id] = [];
    const prev = _activeEffect; _activeEffect = id; _effectFns[id](); _activeEffect = prev;
  }

  function effect(fn) {
    const id = _effectFns.length; _effectFns.push(fn); _effectDeps.push([]); _runEffect(id);
  }

  function computed(fn) {
    const s = signal(undefined);
    effect(function() { s.set(fn()); });
    return s;
  }

  function batch(fn) {
    _batchDepth++; fn(); _batchDepth--;
    if (_batchDepth === 0 && _dirtySignals.length > 0) _drainDirty();
  }

  function _drainDirty() {
    const signals = _dirtySignals; const count = signals.length;
    const snapshot = new Array(count);
    for (let i = 0; i < count; i++) { snapshot[i] = signals[i]; if (signals[i] < 8192) _dirtyBitmap[signals[i]] = 0; }
    signals.length = 0;
    for (let i = 0; i < count; i++) _flushSignal(snapshot[i]);
  }

  function _reset() {
    _values.length = 0; _subs.length = 0; _manualSubs.length = 0;
    _effectFns.length = 0; _effectDeps.length = 0; _activeEffect = -1;
    _batchDepth = 0; _dirtySignals = []; _dirtyBitmap = new Uint8Array(8192);
  }

  function bench(name, fn, durationMs) {
    durationMs = durationMs || 2000;
    let ops = 0;
    const end = performance.now() + durationMs;
    while (performance.now() < end) { fn(); ops++; }
    const elapsed = performance.now() - (end - durationMs);
    return { name: name, ops: ops, elapsed: elapsed, opsPerSec: Math.round(ops / (elapsed / 1000)) };
  }

  function formatNum(n) { return n.toLocaleString(); }

  const results = [];

  function runAll() {
    const el = document.getElementById('results');
    const status = document.getElementById('status');

    status.textContent = 'Running: Signal Creation (100k)...';
    setTimeout(function() {
      const r1 = bench('signal_creation_100k', function() {
        _reset();
        for (let i = 0; i < 100000; i++) signal(i);
      }, 2000);
      results.push(r1);
      el.innerHTML += '<div class="section">SIGNAL OPERATIONS</div>';
      el.innerHTML += '<div class="result">' + r1.name + ': <span class="metric">' + formatNum(r1.opsPerSec) + ' ops/sec</span></div>';

      status.textContent = 'Running: Signal Read (100k)...';
      setTimeout(function() {
        _reset();
        const sigs = [];
        for (let i = 0; i < 100000; i++) sigs.push(signal(i));
        const r2 = bench('signal_read_100k', function() {
          for (let i = 0; i < 100000; i++) sigs[i]();
        }, 2000);
        results.push(r2);
        el.innerHTML += '<div class="result">' + r2.name + ': <span class="metric">' + formatNum(r2.opsPerSec) + ' ops/sec</span></div>';

        status.textContent = 'Running: Signal Write (100k)...';
        setTimeout(function() {
          const r3 = bench('signal_write_100k', function() {
            for (let i = 0; i < 100000; i++) sigs[i].set(i + 1);
          }, 2000);
          results.push(r3);
          el.innerHTML += '<div class="result">' + r3.name + ': <span class="metric">' + formatNum(r3.opsPerSec) + ' ops/sec</span></div>';
          _reset();

          status.textContent = 'Running: Effect Creation (10k)...';
          setTimeout(function() {
            const r4 = bench('effect_creation_10k', function() {
              _reset();
              const s1 = signal(0); const s2 = signal(1);
              for (let i = 0; i < 10000; i++) effect(function() { s1(); s2(); });
            }, 2000);
            results.push(r4);
            el.innerHTML += '<div class="section">EFFECT OPERATIONS</div>';
            el.innerHTML += '<div class="result">' + r4.name + ': <span class="metric">' + formatNum(r4.opsPerSec) + ' ops/sec</span></div>';

            status.textContent = 'Running: Effect Re-run (10k signals, trigger all)...';
            setTimeout(function() {
              _reset();
              const sigs = [];
              const counters = [];
              for (let i = 0; i < 10000; i++) { sigs.push(signal(0)); counters.push(0); }
              for (let i = 0; i < 10000; i++) {
                (function(idx) { effect(function() { sigs[idx](); counters[idx]++; }); })(i);
              }
              const r5 = bench('effect_rerun_10k', function() {
                for (let i = 0; i < 10000; i++) sigs[i].set(counters[i]++);
              }, 2000);
              results.push(r5);
              el.innerHTML += '<div class="result">' + r5.name + ': <span class="metric">' + formatNum(r5.opsPerSec) + ' ops/sec</span></div>';
              _reset();

              status.textContent = 'Running: Batch Update (10k signals)...';
              setTimeout(function() {
                const sigs = [];
                for (let i = 0; i < 10000; i++) sigs.push(signal(0));
                for (let i = 0; i < 10000; i++) {
                  (function(idx) { effect(function() { sigs[idx](); }); })(i);
                }
                let counter = 0;
                const r6 = bench('batch_update_10k', function() {
                  batch(function() { for (let i = 0; i < 10000; i++) sigs[i].set(counter++); });
                }, 2000);
                results.push(r6);
                el.innerHTML += '<div class="section">BATCH OPERATIONS</div>';
                el.innerHTML += '<div class="result">' + r6.name + ': <span class="metric">' + formatNum(r6.opsPerSec) + ' ops/sec</span></div>';
                _reset();

                status.textContent = 'Running: Computed Chain (1000 deep)...';
                setTimeout(function() {
                  _reset();
                  const root = signal(0);
                  let current = root;
                  for (let i = 0; i < 1000; i++) {
                    current = computed(function() { return current() + 1; });
                  }
                  let val = 0;
                  const r7 = bench('computed_chain_1000', function() { root.set(val++); }, 2000);
                  results.push(r7);
                  el.innerHTML += '<div class="section">COMPUTED OPERATIONS</div>';
                  el.innerHTML += '<div class="result">' + r7.name + ': <span class="metric">' + formatNum(r7.opsPerSec) + ' ops/sec</span></div>';
                  _reset();

                  status.textContent = 'Running: DOM Creation (10k elements)...';
                  setTimeout(function() {
                    const container = document.createElement('div');
                    document.body.appendChild(container);
                    const r8 = bench('dom_create_10k', function() {
                      container.innerHTML = '';
                      for (let i = 0; i < 10000; i++) {
                        const d = document.createElement('div');
                        d.className = 'item';
                        d.textContent = 'item';
                        container.appendChild(d);
                      }
                    }, 2000);
                    document.body.removeChild(container);
                    results.push(r8);
                    el.innerHTML += '<div class="section">DOM OPERATIONS</div>';
                    el.innerHTML += '<div class="result">' + r8.name + ': <span class="metric">' + formatNum(r8.opsPerSec) + ' ops/sec</span></div>';

                    status.textContent = 'Running: DOM Update (5k elements)...';
                    setTimeout(function() {
                      const container2 = document.createElement('div');
                      document.body.appendChild(container2);
                      const els = [];
                      for (let i = 0; i < 5000; i++) {
                        const d = document.createElement('div');
                        d.className = 'item';
                        d.textContent = 'initial';
                        container2.appendChild(d);
                        els.push(d);
                      }
                      let v = 0;
                      const r9 = bench('dom_update_5k', function() {
                        for (let i = 0; i < 5000; i++) {
                          els[i].textContent = 'val-' + (v++);
                          els[i].style.color = v % 2 ? 'red' : 'blue';
                        }
                      }, 2000);
                      document.body.removeChild(container2);
                      results.push(r9);
                      el.innerHTML += '<div class="result">' + r9.name + ': <span class="metric">' + formatNum(r9.opsPerSec) + ' ops/sec</span></div>';

                      status.textContent = 'Running: Full Pipeline (signal → effect → DOM, 5k)...';
                      setTimeout(function() {
                        const container3 = document.createElement('div');
                        document.body.appendChild(container3);
                        const sigs = [];
                        const domEls = [];
                        for (let i = 0; i < 5000; i++) {
                          const s = signal(0);
                          const d = document.createElement('div');
                          d.textContent = '0';
                          container3.appendChild(d);
                          sigs.push(s);
                          domEls.push(d);
                        }
                        for (let i = 0; i < 5000; i++) {
                          (function(idx) { effect(function() { domEls[idx].textContent = String(sigs[idx]()); }); })(i);
                        }
                        let cv = 0;
                        const r10 = bench('full_pipeline_5k_sig_effect_dom', function() {
                          for (let i = 0; i < 5000; i++) sigs[i].set(cv++);
                        }, 2000);
                        document.body.removeChild(container3);
                        results.push(r10);
                        el.innerHTML += '<div class="section">FULL PIPELINE (Signal → Effect → DOM)</div>';
                        el.innerHTML += '<div class="result">' + r10.name + ': <span class="metric">' + formatNum(r10.opsPerSec) + ' ops/sec</span></div>';

                        status.textContent = 'Running: 10k Signal Batch Stress...';
                        setTimeout(function() {
                          _reset();
                          const sigs = [];
                          for (let i = 0; i < 10000; i++) sigs.push(signal(0));
                          for (let i = 0; i < 10000; i++) {
                            (function(idx) { effect(function() { sigs[idx](); }); })(i);
                          }
                          let cv = 0;
                          const r11 = bench('batch_10k_stress', function() {
                            batch(function() { for (let i = 0; i < 10000; i++) sigs[i].set(cv++); });
                          }, 3000);
                          results.push(r11);
                          el.innerHTML += '<div class="section">BATCH STRESS</div>';
                          el.innerHTML += '<div class="result">' + r11.name + ': <span class="metric">' + formatNum(r11.opsPerSec) + ' ops/sec</span></div>';
                          _reset();

                          status.textContent = 'Running: 3000-particle simulation (5s)...';
                          setTimeout(function() {
                            _reset();
                            const NUM = 3000;
                            const sigs = [];
                            for (let i = 0; i < NUM; i++) sigs.push(signal('translate(0px, 0px)'));
                            for (let i = 0; i < NUM; i++) {
                              (function(idx) { effect(function() { var _ = sigs[idx](); }); })(i);
                            }
                            let frames = 0;
                            const start = performance.now();
                            const end = start + 5000;
                            let x = 0;
                            while (performance.now() < end) {
                              batch(function() {
                                for (let i = 0; i < NUM; i++) {
                                  x += 0.1;
                                  sigs[i].set('translate(' + Math.sin(x + i) * 100 + 'px, ' + Math.cos(x + i) * 100 + 'px)');
                                }
                              });
                              frames++;
                            }
                            const elapsed = performance.now() - start;
                            const fps = Math.round(frames / (elapsed / 1000));
                            const r12 = { name: 'particle_sim_3k_' + NUM + '_frames_' + frames + '_in_' + Math.round(elapsed) + 'ms', ops: frames, elapsed: elapsed, opsPerSec: fps };
                            results.push(r12);
                            el.innerHTML += '<div class="section">PARTICLE SIMULATION</div>';
                            el.innerHTML += '<div class="result">' + r12.name + ': <span class="metric">' + formatNum(fps) + ' FPS</span></div>';
                            _reset();

                            const dataEl = document.getElementById('benchmark-data');
                            dataEl.textContent = JSON.stringify(results);
                            dataEl.setAttribute('data-done', 'true');
                            status.textContent = 'BENCHMARK COMPLETE — ' + results.length + ' tests';
                          }, 100);
                        }, 100);
                      }, 100);
                    }, 100);
                  }, 100);
                }, 100);
              }, 100);
            }, 100);
          }, 100);
        }, 100);
      }, 100);
    }, 100);
  }

  window.runBenchmarks = runAll;
  document.getElementById('status').textContent = 'Ready. Click to start.';
  runAll();
})();
</script>
</body>
</html>
