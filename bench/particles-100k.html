<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>100K PARTICLES — Dominator WebWorker Benchmark</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#05050a; overflow:hidden; font-family:'Courier New',monospace; color:#fff; }
  .p { position:absolute; width:3px; height:3px; border-radius:50%; will-change:transform; contain:layout style; }
  #hud { position:fixed; top:12px; right:12px; background:rgba(0,0,0,.9); border:1px solid #222; border-radius:6px; padding:14px 18px; font-size:11px; z-index:999; min-width:200px; }
  #hud h2 { font-size:13px; color:#0ff; letter-spacing:2px; margin-bottom:10px; }
  .r { display:flex; justify-content:space-between; margin:3px 0; color:#666; }
  .g { color:#0f8; font-weight:700; }
  .y { color:#ff0; font-weight:700; }
  .r { color:#f44; font-weight:700; }
  .d { border-top:1px solid #222; margin:6px 0; }
  #info { position:fixed; bottom:12px; left:12px; font-size:11px; color:#444; }
  #bar { position:fixed; bottom:0; left:0; height:3px; background:#0f8; width:0%; transition:width .1s; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h2>100K PARTICLES</h2>
  <div class="r"><span>MODE</span><span id="h-mode" class="g">CHAOS</span></div>
  <div class="r"><span>FPS</span><span id="h-fps" class="g">--</span></div>
  <div class="r"><span>FRAME</span><span id="h-frame" class="g">--ms</span></div>
  <div class="r"><span>PHYSICS</span><span id="h-phys" class="g">--ms</span></div>
  <div class="r"><span>DOM</span><span id="h-dom" class="g">--ms</span></div>
  <div class="d"></div>
  <div class="r"><span>PARTICLES</span><span id="h-count" class="y">--</span></div>
  <div class="r"><span>DOM NODES</span><span id="h-nodes" class="y">--</span></div>
  <div class="r"><span>HEAP</span><span id="h-heap" class="y">--</span></div>
  <div class="d"></div>
  <div class="r"><span>AVG FPS</span><span id="h-avg" class="g">--</span></div>
  <div class="r"><span>MIN FPS</span><span id="h-min" class="g">--</span></div>
  <div class="r"><span>P95 FPS</span><span id="h-p95" class="g">--</span></div>
</div>
<div id="info">click = explode | mouse = repel | auto mode toggle</div>
<div id="bar"></div>

<script>
(function(){
var N = 100000;
var HEADER = 64;
var FPP = 8;
var app = document.getElementById('app');

// ── Shared memory ──────────────────────────────────────────────────
var buf = new SharedArrayBuffer((HEADER + N * FPP) * 4);
var hdr = new Int32Array(buf, 0, HEADER);
var data = new Float32Array(buf, HEADER * 4, N * FPP);

Atomics.store(hdr, 7, window.innerWidth);
Atomics.store(hdr, 8, window.innerHeight);

// ── Worker (inline blob) ───────────────────────────────────────────
var wCode = [
'var H=64,F=8,_px,_py,_vx,_vy,_w=1920,_h=1080,_mx=960,_my=540,_mode=0,_tick=0,_sd,_sh,_N=0;',
'var _rng=123456789;',
'function xor(){_rng^=_rng<<13;_rng^=_rng>>17;_rng^=_rng<<5;return(_rng>>>0)/4294967296;}',
'self.onmessage=function(e){var m=e.data;',
'if(m.type==="init"){_N=m.count;var b=m.buffer;',
'_sh=new Int32Array(b,0,H);_sd=new Float32Array(b,H*4,_N*F);',
'_px=new Float32Array(_N);_py=new Float32Array(_N);',
'_vx=new Float32Array(_N);_vy=new Float32Array(_N);',
'for(var i=0;i<_N;i++){_px[i]=xor()*_w;_py[i]=xor()*_h;_vx[i]=(xor()-.5)*5;_vy[i]=(xor()-.5)*5;}',
'loop();}',
'if(m.type==="explode"){for(var i=0;i<_N;i++){_vx[i]=(xor()-.5)*60;_vy[i]=(xor()-.5)*60;}}',
'if(m.type==="targets"){var t=new Float32Array(m.buf);_tx=new Float32Array(t.length>>1);_ty=new Float32Array(t.length>>1);',
'for(var i=0;i<_tx.length;i++){_tx[i]=t[i*2];_ty[i]=t[i*2+1];}}',
'};',
'function loop(){if(!_N)return;',
'_mx=Atomics.load(_sh,3);_my=Atomics.load(_sh,4);_mode=Atomics.load(_sh,5);',
'_w=Atomics.load(_sh,7);_h=Atomics.load(_sh,8);_tick++;',
'var fm=_mode===1;',
'for(var i=0;i<_N;i++){',
'var x=_px[i],y=_py[i],vx=_vx[i],vy=_vy[i];',
'if(fm&&_tx){',
'var dx=_tx[i%_tx.length]-x,dy=_ty[i%_ty.length]-y;',
'vx+=dx*.05;vy+=dy*.05;vx*=.85;vy*=.85;',
'}else{',
'var dx=_mx-x,dy=_my-y,d2=dx*dx+dy*dy;',
'if(d2<200000){var d=Math.sqrt(d2)||1,f=(450-d)/450;vx-=dx*f*.12;vy-=dy*f*.12;}',
'vx+=(xor()-.5)*.15;vy+=(xor()-.5)*.15;vx*=.96;vy*=.96;',
'x+=vx;y+=vy;',
'if(x<0)x+=_w;else if(x>_w)x-=_w;',
'if(y<0)y+=_h;else if(y>_h)y-=_h;',
'}',
'_px[i]=x;_py[i]=y;_vx[i]=vx;_vy[i]=vy;',
'}',
'for(var i=0;i<_N;i++){var b=i*F;_sd[b]=_px[i];_sd[b+1]=_py[i];',
'var ddx=_mx-_px[i],ddy=_my-_py[i],d2=ddx*ddx+ddy*ddy;',
'if(fm){_sd[b+2]=255;_sd[b+3]=255;_sd[b+4]=255;_sd[b+5]=.9;}',
'else if(d2<200000){_sd[b+2]=255;_sd[b+3]=50;_sd[b+4]=80;_sd[b+5]=.95;}',
'else{_sd[b+2]=0;_sd[b+3]=180;_sd[b+4]=255;_sd[b+5]=.7;}',
'}',
'Atomics.store(_sh,0,1);Atomics.notify(_sh,0);',
'requestAnimationFrame(loop);}'
].join('\n');

var blob = new Blob([wCode], {type:'application/javascript'});
var worker = new Worker(URL.createObjectURL(blob));

worker.postMessage({type:'init', count:N, buffer:buf});

// ── Pre-allocate DOM ──────────────────────────────────────────────
var frag = document.createDocumentFragment();
var els = new Array(N);
for(var i=0;i<N;i++){
  var d = document.createElement('div');
  d.className='p';
  els[i]=d;
  frag.appendChild(d);
}
app.appendChild(frag);

// ── Mouse ─────────────────────────────────────────────────────────
var mx=window.innerWidth/2, my=window.innerHeight/2;
window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;Atomics.store(hdr,3,mx);Atomics.store(hdr,4,my);});
window.addEventListener('click',function(){worker.postMessage({type:'explode'});});
window.addEventListener('resize',function(){Atomics.store(hdr,7,window.innerWidth);Atomics.store(hdr,8,window.innerHeight);});

// ── Mode toggle ───────────────────────────────────────────────────
var mode=0;
setInterval(function(){mode=mode?0:1;Atomics.store(hdr,5,mode);
document.getElementById('h-mode').textContent=mode?'FORM':'CHAOS';
document.getElementById('h-mode').className=mode?'y':'g';
},3000);

// ── FPS tracking ──────────────────────────────────────────────────
var fpsRing=new Float64Array(128),fpsPos=0,fpsLen=0,fpsMin=999,fpsSum=0;
var frameTimes=new Float64Array(128),ftPos=0,ftLen=0;
var physTimes=new Float64Array(128),ptPos=0,ptLen=0;
var fc=0,lastT=performance.now();

// ── Render loop ───────────────────────────────────────────────────
var hFps=document.getElementById('h-fps');
var hFrame=document.getElementById('h-frame');
var hPhys=document.getElementById('h-phys');
var hDom=document.getElementById('h-dom');
var hCount=document.getElementById('h-count');
var hNodes=document.getElementById('h-nodes');
var hHeap=document.getElementById('h-heap');
var hAvg=document.getElementById('h-avg');
var hMin=document.getElementById('h-min');
var hP95=document.getElementById('h-p95');
var bar=document.getElementById('bar');

hCount.textContent=N.toLocaleString();

function render(){
  var t0=performance.now();
  var cmd=Atomics.load(hdr,0);
  if(cmd===1){
    var pStart=performance.now();

    for(var i=0;i<N;i++){
      var b=i*FPP;
      var el=els[i];
      el.style.transform='translate3d('+(data[b]|0)+'px,'+(data[b+1]|0)+'px,0)';
      el.style.backgroundColor='rgba('+(data[b+2]|0)+','+(data[b+3]|0)+','+(data[b+4]|0)+','+data[b+5].toFixed(2)+')';
    }

    var pEnd=performance.now();
    Atomics.store(hdr,0,0);

    var now=performance.now();
    var delta=now-lastT;
    lastT=now;
    fc++;

    fpsRing[fpsPos]=delta;fpsPos=(fpsPos+1)&127;if(fpsLen<128)fpsLen++;
    frameTimes[ftPos]=delta;ftPos=(ftPos+1)&127;if(ftLen<128)ftLen++;
    physTimes[ptPos]=pEnd-pStart;ptPos=(ptPos+1)&127;if(ptLen<128)ptLen++;

    if((fc&7)===0){
      var sum=0;for(var j=0;j<fpsLen;j++)sum+=fpsRing[j];
      var avgD=sum/fpsLen;
      var fps=avgD>0?Math.min(999,Math.round(1000/avgD)):0;

      var fsum=0;for(var j=0;j<ftLen;j++)fsum+=frameTimes[j];
      var avgFrame=fsum/ftLen;

      var psum=0;for(var j=0;j<ptLen;j++)psum+=physTimes[j];
      var avgPhys=psum/ptLen;

      var domTime=(performance.now()-t0-avgPhys);

      if(fps<fpsMin)fpsMin=fps;
      fpsSum+=fps;

      // percentiles
      var sorted=new Float64Array(fpsRing.subarray(0,fpsLen));
      sorted.sort();
      var p95=sorted[Math.floor(sorted.length*.95)]|0;
      var p95fps=p95>0?Math.round(1000/p95):0;

      hFps.textContent=fps;
      hFps.className=fps>=55?'g':fps>=45?'y':'r';
      hFrame.textContent=avgFrame.toFixed(1)+'ms';
      hPhys.textContent=avgPhys.toFixed(1)+'ms';
      hDom.textContent=domTime.toFixed(1)+'ms';
      hAvg.textContent=Math.round(fpsSum/(fc/8));
      hAvg.className='g';
      hMin.textContent=fpsMin;
      hMin.className=fpsMin>=55?'g':fpsMin>=45?'y':'r';
      hP95.textContent=p95fps;
      hP95.className='g';
      bar.style.width=Math.min(100,fps/60*100)+'%';
      bar.style.background=fps>=55?'#0f8':fps>=45?'#ff0':'#f44';
    }
  }

  // Heap
  if(fc&63){
    if(performance.memory){
      hHeap.textContent=(performance.memory.usedJSHeapSize/1048576).toFixed(1)+'MB';
    }
    hNodes.textContent=document.querySelectorAll('.p').length;
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Expose for CDP benchmark
window.__bench = {
  getFps: function(){ var sum=0;for(var j=0;j<fpsLen;j++)sum+=fpsRing[j]; return fpsLen>0?Math.round(1000/(sum/fpsLen)):0; },
  getMinFps: function(){ return fpsMin; },
  getFrameCount: function(){ return fc; },
  getAvgFrame: function(){ var sum=0;for(var j=0;j<ftLen;j++)sum+=frameTimes[j]; return ftLen>0?(sum/ftLen).toFixed(2):'0'; },
  getAvgPhys: function(){ var sum=0;for(var j=0;j<ptLen;j++)sum+=physTimes[j]; return ptLen>0?(sum/ptLen).toFixed(2):'0'; }
};
})();
</script>
</body>
</html>
